services:
  - type: web
    name: fridgebook-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /profile
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: fridgebook-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://fridgebook-app.netlify.app/auth/google/redirect
      - key: CLIENT_URL
        value: https://fridgebook-app.netlify.app/

databases:
  - name: fridgebook-db
    plan: free
    databaseName: fridgebook
    user: fridgebook
